[project]
name = "hyndsyght"
version = "0.1.0"
description = "A lightweight timetracking application with tasteful and easy to usee UI."
authors = [{ name = "Jurre-Jan Smit" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.0",
    "fastapi>=0.141.1",
    "pyobjc-framework-cocoa>=12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.1 ; sys_platform == 'darwin'",
    "uvicorn>=0.52.1",
]

[project.scripts]
hyndsyght = "hyndsyght.cli:main"

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
    "mypy>=2.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyndsyght"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "hyndsyght/static"

[tool.ruff]
# .claude/scripts are template-owned hook scripts; blind excepts there are deliberate.
extend-exclude = [".claude"]

[[tool.mypy.overrides]]
module = ["Quartz.*", "AppKit.*", "PyObjCTools.*"]
ignore_missing_imports = true
